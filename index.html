<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LCCI Level 1：148 道短題、120 分鐘 30 題完整原創模擬卷，分錄、Ledger 及財務報表填寫與逐格評分。">
  <title>Balance — LCCI Level 1 溫習室</title>
  <style>[hidden] { display: none !important; }
.exam-mode-switch { width: min(1280px, calc(100% - 48px)); margin: 30px auto 0; display: flex; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 12px; flex-wrap: wrap; }
.exam-mode-switch button, .exam-actions > button, .exam-run-toolbar > button, .exam-flag, .exam-running-banner button { border: 1px solid var(--line); background: var(--paper-bright); padding: 12px 18px; cursor: pointer; }
.exam-mode-switch [aria-pressed="true"] { background: var(--ink); color: var(--paper-bright); border-color: var(--ink); }
.exam-running-banner { padding: 12px 24px; background: var(--yellow); display: flex; gap: 24px; justify-content: center; align-items: center; }
.full-exam { padding-top: 48px; }
.full-exam-intro { display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: start; }
.full-exam h1 { font: 500 clamp(34px, 4vw, 62px)/1.3 Georgia, "Noto Serif TC", "Microsoft JhengHei", serif; margin: 22px 0; letter-spacing: -.04em; }
.full-exam p { line-height: 1.85; }
.full-exam button:disabled { opacity: .45; cursor: not-allowed; }
.full-exam input:focus-visible, .full-exam button:focus-visible, .exam-mode-switch button:focus-visible, .exam-table-scroll:focus-visible { outline: 3px solid var(--mint-dark); outline-offset: 3px; }
.full-exam-numbers { display: flex; margin: 32px 0; gap: 36px; }
.full-exam-numbers span { display: grid; gap: 6px; color: var(--ink-soft); }
.full-exam-numbers strong { font: 48px Georgia, serif; color: var(--ink); }
.exam-instructions { background: var(--paper-bright); padding: 28px; border-top: 4px solid var(--mint); }
.exam-instructions h2, .exam-history h2 { font-size: 20px; margin: 0 0 20px; }
.exam-instructions ul { padding-left: 20px; margin: 0; }
.exam-instructions li { margin: 12px 0; line-height: 1.7; font-size: 14px; }
.exam-source-note { font-size: 13px; margin: 32px 0; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 20px; }
.exam-source-note a { text-decoration: underline; }
.exam-history { padding-top: 32px; }
.exam-history button { display: flex; justify-content: space-between; gap: 20px; width: 100%; text-align: left; padding: 20px 0; background: transparent; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.exam-run-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 18px 24px; background: var(--ink); color: var(--paper-bright); position: sticky; top: 0; z-index: 15; }
.exam-run-toolbar > div { display: grid; gap: 6px; }
.exam-run-toolbar span { font-size: 12px; opacity: .8; }
.exam-run-toolbar .timer { color: var(--paper-bright); font-variant-numeric: tabular-nums; }
.exam-run-toolbar .timer.urgent { color: #ffb5a7; }
.exam-run-toolbar > button { color: var(--ink); }
.exam-workspace { display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 24px; margin-top: 24px; align-items: start; }
.exam-navigator { position: sticky; top: 110px; }
.exam-navigator h2 { font-size: 18px; margin: 0; }
.exam-navigator p { font-size: 12px; color: var(--ink-soft); }
.exam-navigator nav { display: grid; grid-template-columns: repeat(5,1fr); gap: 5px; }
.exam-navigator button { position: relative; border: 1px solid var(--line); background: var(--paper-bright); min-height: 39px; cursor: pointer; }
.exam-navigator button.complete { background: #cce7db; }
.exam-navigator button.current { outline: 2px solid var(--ink); outline-offset: 1px; }
.exam-navigator button small { display: block; position: absolute; bottom: 0; right: 1px; font-size: 9px; }
.exam-question { min-width: 0; padding: 32px; background: var(--paper-bright); }
.exam-question h2 { margin: 24px 0 16px; font: 30px/1.4 Georgia, "Microsoft JhengHei", serif; scroll-margin-top: 130px; }
.exam-prompt { white-space: pre-line; font-size: 16px; }
.exam-flag { font-size: 13px; padding: 8px 12px; margin: 0 0 16px; }
.exam-flag[aria-pressed="true"] { background: var(--yellow); }
.exam-table-scroll { overflow-x: auto; margin: 22px 0; max-width: 100%; }
.exam-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
.exam-table caption { text-align: left; font-weight: 700; padding: 12px 0; line-height: 1.5; }
.exam-table th, .exam-table td { border: 1px solid var(--line); padding: 10px; line-height: 1.5; min-width: 70px; }
.exam-table th { background: #e7e8dd; font-size: 12px; }
.exam-table td:first-child { min-width: 145px; }
.exam-table input { width: 100%; min-width: 100px; max-width: 230px; border: 1px solid #a7b4ac; background: white; padding: 10px 8px; border-radius: 2px; color: var(--ink); }
.exam-table input:not([inputmode="decimal"]) { min-width: 160px; }
.exam-short-answer { display: grid; gap: 12px; margin: 24px 0; }
.exam-short-answer input { width: min(100%, 440px); border: 1px solid #a7b4ac; padding: 16px; background: white; color: var(--ink); }
.exam-field-help { font-size: 12px; color: var(--ink-soft); }
.exam-choices { border: 0; padding: 0; margin: 20px 0; display: grid; gap: 10px; }
.exam-choices legend { font-size: 13px; padding-bottom: 12px; }
.exam-choices label { display: flex; gap: 14px; align-items: center; border: 1px solid var(--line); padding: 18px; cursor: pointer; }
.exam-choices label:has(input:checked) { border-color: var(--mint-dark); background: #e0f0e7; }
.exam-choices input { width: 18px; height: 18px; accent-color: var(--mint-dark); }
.exam-choices span { font-family: Georgia, serif; }
.exam-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 24px 0; }
.exam-actions .primary { background: var(--ink); color: var(--paper-bright); }
.exam-actions.split { justify-content: space-between; }
.exam-confirm { border: 2px solid var(--apricot); padding: 20px 28px; background: #fff0dd; margin-top: 16px; }
.exam-confirm h2 { margin: 0; font-size: 20px; }
.exam-result-head { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
.exam-score { font: 96px Georgia, serif; color: var(--mint-dark); }
.exam-score small { font-size: 24px; color: var(--ink-soft); }
.exam-marking-note { padding: 16px 22px; border-left: 4px solid var(--apricot); background: var(--paper-bright); font-size: 14px; }
.exam-topic-results { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 30px 0; }
.exam-topic-results > div { padding: 18px; border: 1px solid var(--line); display: grid; gap: 14px; }
.exam-topic-results span { font-size: 12px; }
.exam-topic-results strong { font: 28px Georgia, serif; }
.exam-topic-results progress { width: 100%; height: 5px; accent-color: var(--mint-dark); }
.exam-review details { border-top: 1px solid var(--line); padding: 18px 0; }
.exam-review summary { cursor: pointer; font-size: 16px; line-height: 1.7; }
.exam-review summary strong { float: right; margin-left: 12px; font-variant-numeric: tabular-nums; }
.exam-review .field-correct { background: #e4f1e6; }
.exam-review .field-incorrect { background: #fff0df; }
.exam-explanation { padding: 18px; background: #e7e8dd; }
@media (max-width: 850px) {
  .full-exam-intro { grid-template-columns: 1fr; gap: 28px; }
  .exam-workspace { grid-template-columns: 1fr; }
  .exam-navigator { position: static; }
  .exam-navigator nav { grid-template-columns: repeat(10, 1fr); }
  .exam-navigator p { display: inline-block; margin: 8px 20px 12px 0; }
  .exam-topic-results { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 560px) {
  .exam-mode-switch { width: calc(100% - 32px); }
  .exam-mode-switch button { font-size: 12px; padding: 12px; }
  .full-exam { padding-top: 28px; }
  .exam-run-toolbar { padding: 12px; gap: 8px; }
  .exam-run-toolbar strong { font-size: 14px; }
  .exam-run-toolbar .timer { font-size: 24px; }
  .exam-run-toolbar > button { padding: 8px; }
  .exam-navigator nav { grid-template-columns: repeat(6, 1fr); }
  .exam-question { padding: 20px 14px; }
  .exam-question h2 { font-size: 26px; }
  .exam-table { font-size: 13px; }
  .exam-table th, .exam-table td { padding: 8px; }
  .exam-score { font-size: 64px; }
  .exam-result-head { align-items: start; }
  .exam-history button { flex-direction: column; gap: 6px; }
  .exam-running-banner { padding: 10px 16px; gap: 12px; font-size: 12px; }
}

.site-notice { margin: 20px auto; padding: 16px; max-width: 1100px; background: #ffe2c8; line-height: 1.7; }
.exam-info { font-size: 14px; line-height: 1.8; }
.exam-info a { text-decoration: underline; margin-left: 8px; }
.mock-review { max-width: 850px; margin: 32px auto; text-align: left; }
.mock-review details { border-bottom: 1px solid #d8d1c5; padding: 16px 0; line-height: 1.7; }
.mock-review summary { cursor: pointer; }

:root {
  --ink: #132a32;
  --ink-soft: #34505a;
  --paper: #f5f0e7;
  --paper-bright: #fffdf8;
  --line: #d8d1c5;
  --mint: #91cbb8;
  --mint-dark: #2b7566;
  --apricot: #f3a36f;
  --apricot-light: #ffe2c8;
  --yellow: #efd06b;
  --red: #b4473d;
  --shadow: 0 18px 55px rgba(19, 42, 50, 0.1);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  color: inherit;
}

.site-shell {
  min-height: 100vh;
  background:
    radial-gradient(circle at 87% 5%, rgba(243, 163, 111, 0.16), transparent 26rem),
    linear-gradient(90deg, transparent 49.9%, rgba(19, 42, 50, 0.025) 50%, transparent 50.1%),
    var(--paper);
}

.topbar {
  width: min(1440px, calc(100% - 48px));
  height: 88px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 260px 1fr 260px;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: 700;
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 21px;
  letter-spacing: -0.02em;
}

.brand small {
  margin-top: 2px;
  color: var(--ink-soft);
  font-size: 9px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.main-nav {
  display: flex;
  justify-content: center;
  gap: 2px;
}

.main-nav button {
  position: relative;
  padding: 34px 16px 30px;
  border: 0;
  background: transparent;
  color: #66767b;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.main-nav button::after {
  position: absolute;
  right: 16px;
  bottom: -1px;
  left: 16px;
  height: 3px;
  background: var(--apricot);
  content: "";
  opacity: 0;
  transform: scaleX(0.4);
  transition: 180ms ease;
}

.main-nav button:hover,
.main-nav button.active {
  color: var(--ink);
}

.main-nav button.active::after {
  opacity: 1;
  transform: scaleX(1);
}

.top-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 13px;
}

.local-badge,
.level-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.local-badge i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mint-dark);
  box-shadow: 0 0 0 4px rgba(145, 203, 184, 0.28);
}

.level-pill {
  padding: 8px 13px;
  border: 1px solid var(--ink);
  border-radius: 999px;
}

.page {
  width: min(1280px, calc(100% - 48px));
  min-height: calc(100vh - 160px);
  margin: 0 auto;
  padding: 72px 0 86px;
}

.eyebrow,
.kicker,
.note-top,
.section-number,
.result-label {
  color: var(--mint-dark);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.17em;
  text-transform: uppercase;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  gap: clamp(50px, 8vw, 120px);
  align-items: center;
  min-height: 490px;
}

.kicker {
  color: var(--apricot);
}

.hero-copy h1,
.page-heading h1,
.mock-intro h1 {
  margin: 17px 0 22px;
  font-family: Georgia, "Songti TC", "Times New Roman", serif;
  font-size: clamp(48px, 5.5vw, 79px);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.05em;
}

.hero-lede,
.page-heading > p,
.mock-intro > p {
  max-width: 590px;
  color: var(--ink-soft);
  font-size: 16px;
  line-height: 1.85;
}

.hero-actions,
.result-actions {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-top: 32px;
}

.primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  min-height: 50px;
  padding: 0 23px;
  border: 1px solid var(--ink);
  border-radius: 2px;
  background: var(--ink);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 5px 5px 0 var(--apricot);
  transition: 160ms ease;
}

.primary:hover {
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 var(--apricot);
}

.primary:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  transform: none;
}

.text-button,
.skip {
  padding: 10px 0;
  border: 0;
  border-bottom: 1px solid var(--ink);
  background: transparent;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.accounting-note {
  position: relative;
  padding: 37px 38px 34px;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(19, 42, 50, 0.08) 32px),
    #fffdf6;
  box-shadow: var(--shadow);
  transform: rotate(1.2deg);
}

.accounting-note::before {
  position: absolute;
  top: -11px;
  left: 41%;
  width: 86px;
  height: 24px;
  background: rgba(239, 208, 107, 0.68);
  content: "";
  transform: rotate(-4deg);
}

.note-top {
  display: flex;
  justify-content: space-between;
  color: #7b887f;
}

.accounting-note h2 {
  margin: 27px 0 10px;
  font-family: Georgia, "Songti TC", serif;
  font-size: 28px;
  font-weight: 500;
}

.accounting-note > p {
  color: var(--ink-soft);
  font-size: 13px;
}

.entry-line {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid rgba(19, 42, 50, 0.18);
}

.entry-line span {
  color: var(--apricot);
  font-family: "Courier New", monospace;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.entry-line strong,
.entry-line b {
  font-family: "Courier New", monospace;
  font-size: 14px;
}

.balance-rule {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 21px 0 0;
  color: var(--mint-dark);
  font-size: 11px;
  font-weight: 800;
}

.balance-rule i {
  height: 1px;
  flex: 1;
  background: var(--mint);
}

.accounting-note .pencil-note {
  margin: 20px 0 0;
  color: #7d7067;
  font-family: "KaiTi", "DFKai-SB", serif;
  font-size: 14px;
  transform: rotate(-1deg);
}

.dashboard-band {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  margin-top: 34px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.progress-block,
.mission-block {
  padding: 38px 44px 42px 0;
}

.mission-block {
  padding-right: 0;
  padding-left: 44px;
  border-left: 1px solid var(--line);
}

.section-title,
.section-title > div {
  display: flex;
  align-items: center;
}

.section-title {
  justify-content: space-between;
  margin-bottom: 29px;
}

.section-title > div {
  gap: 12px;
}

.section-title h2 {
  margin: 0;
  font-family: Georgia, "Songti TC", serif;
  font-size: 23px;
  font-weight: 500;
}

.section-number {
  color: var(--apricot);
}

.muted {
  color: #79878b;
  font-size: 11px;
}

.progress-layout {
  display: flex;
  align-items: center;
  gap: 38px;
}

.score-ring {
  width: 132px;
  height: 132px;
  padding: 11px;
  border-radius: 50%;
  background: conic-gradient(var(--mint-dark) var(--score), #dfd9cd 0);
}

.score-ring > div {
  width: 100%;
  height: 100%;
  display: grid;
  place-content: center;
  border-radius: 50%;
  background: var(--paper);
  text-align: center;
}

.score-ring strong {
  font-family: Georgia, serif;
  font-size: 30px;
}

.score-ring span {
  margin-top: 3px;
  color: #748287;
  font-size: 10px;
}

.metric-list {
  display: grid;
  gap: 10px;
  flex: 1;
}

.metric-list > div {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-bottom: 8px;
  border-bottom: 1px dotted #bfb8ac;
}

.metric-list span {
  color: var(--ink-soft);
  font-size: 11px;
}

.metric-list strong {
  font-family: Georgia, serif;
  font-size: 21px;
}

.metric-list small,
.mock-specs small {
  margin-left: 3px;
  font-family: inherit;
  font-size: 9px;
}

.level-track {
  margin-top: 24px;
}

.level-track > div:first-child {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  color: #68787d;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.track,
.mock-progress {
  height: 5px;
  overflow: hidden;
  background: #ded8cc;
}

.track i,
.mock-progress i {
  display: block;
  height: 100%;
  background: var(--apricot);
  transition: width 280ms ease;
}

.week-chip {
  padding: 6px 9px;
  border-radius: 2px;
  background: var(--apricot-light);
  color: #8a4d2c;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
}

.mission {
  display: grid;
  grid-template-columns: 38px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 15px 0;
  border-top: 1px dotted #bfb8ac;
}

.mission-index {
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--mint);
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: 700;
}

.mission-index.warm {
  background: var(--apricot-light);
}

.mission strong,
.mission small {
  display: block;
}

.mission strong {
  font-size: 13px;
}

.mission small {
  margin-top: 4px;
  color: #738186;
  font-size: 10px;
}

.mission em {
  color: #6b7a7f;
  font-size: 9px;
  font-style: normal;
  font-weight: 800;
}

.weak-line {
  display: flex;
  justify-content: space-between;
  margin: 17px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 11px;
}

.weak-line span {
  color: #7a888c;
}

.bank-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr) 1.7fr;
  margin-top: 42px;
  background: var(--ink);
  color: #fff;
}

.bank-strip > div,
.bank-strip button {
  min-height: 91px;
  padding: 19px 22px;
  border: 0;
  border-right: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: inherit;
  text-align: left;
}

.bank-strip strong,
.bank-strip span {
  display: block;
}

.bank-strip strong {
  font-family: Georgia, serif;
  font-size: 24px;
}

.bank-strip span {
  margin-top: 4px;
  color: #b8c3c5;
  font-size: 9px;
  letter-spacing: 0.07em;
}

.bank-strip button {
  padding-left: 35px;
  background: var(--mint);
  color: var(--ink);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 50px;
  margin-bottom: 48px;
}

.page-heading h1 {
  margin-bottom: 0;
  font-size: clamp(46px, 5vw, 70px);
}

.page-heading > p {
  max-width: 400px;
  margin: 0 0 8px;
  font-size: 14px;
}

.page-heading.compact {
  margin-bottom: 58px;
}

.filter-bar {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 0.8fr 0.6fr;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}

.filter-bar label {
  padding: 15px 20px;
  border-right: 1px solid var(--line);
  color: #718085;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.filter-bar select {
  width: 100%;
  margin-top: 5px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  outline: 0;
}

.filter-count {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.filter-count strong {
  font-family: Georgia, serif;
  font-size: 27px;
}

.filter-count span {
  color: #718085;
  font-size: 10px;
}

.question-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 230px;
  gap: 40px;
  margin-top: 38px;
}

.question-card {
  min-height: 480px;
  padding: clamp(28px, 5vw, 60px);
  background: var(--paper-bright);
  box-shadow: var(--shadow);
}

.question-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}

.question-meta span,
.question-meta b {
  padding: 5px 8px;
  background: #ece8df;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.question-meta b {
  margin-left: auto;
  background: transparent;
  color: #7b898d;
}

.question-meta .difficulty {
  background: var(--mint);
}

.question-meta .d-挑戰 {
  background: var(--apricot-light);
}

.question-card h2 {
  max-width: 820px;
  margin: 34px 0 30px;
  font-family: Georgia, "Songti TC", serif;
  font-size: clamp(24px, 3vw, 35px);
  font-weight: 500;
  line-height: 1.45;
}

.option-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.option-list button {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 60px;
  padding: 13px 16px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 12px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  transition: 150ms ease;
}

.option-list button:hover:not(:disabled),
.option-list button.selected {
  border-color: var(--ink);
  background: #eef7f3;
}

.option-list button.correct-option {
  border-color: var(--mint-dark);
  background: #dff1e9;
}

.option-list button span {
  width: 29px;
  height: 29px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: #738186;
  font-family: Georgia, serif;
}

.answer-field {
  display: block;
  color: #6e7e82;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.answer-field input {
  width: 100%;
  margin-top: 10px;
  padding: 18px 0;
  border: 0;
  border-bottom: 2px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-family: Georgia, "Songti TC", serif;
  font-size: 22px;
  outline: 0;
}

.answer-field input::placeholder {
  color: #aaa69f;
}

.feedback {
  margin-top: 30px;
  padding: 24px;
  border-left: 4px solid var(--mint-dark);
  background: #e6f3ed;
}

.feedback.is-wrong {
  border-color: var(--red);
  background: #f8e7e2;
}

.feedback-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.feedback-title > span {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--mint-dark);
  color: #fff;
  font-size: 20px;
}

.is-wrong .feedback-title > span {
  background: var(--red);
}

.feedback-title strong,
.feedback-title small {
  display: block;
}

.feedback-title small {
  margin-top: 2px;
  color: var(--ink-soft);
  font-size: 10px;
}

.feedback > p {
  margin: 15px 0;
  font-size: 13px;
  line-height: 1.7;
}

.feedback-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  padding-top: 13px;
  border-top: 1px solid rgba(19, 42, 50, 0.14);
}

.feedback-grid b,
.feedback-grid span {
  display: block;
}

.feedback-grid b {
  margin-bottom: 4px;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.feedback-grid span {
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.55;
}

.question-actions {
  display: flex;
  align-items: center;
  gap: 23px;
  margin-top: 34px;
}

.question-actions.split {
  justify-content: space-between;
}

.practice-aside {
  display: grid;
  align-content: start;
  gap: 13px;
}

.mini-stat {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
}

.mini-stat span {
  color: #748388;
  font-size: 10px;
}

.mini-stat strong {
  font-family: Georgia, serif;
  font-size: 25px;
}

.tip-note {
  margin-top: 18px;
  padding: 25px 22px 30px;
  background: var(--yellow);
  transform: rotate(1.3deg);
}

.tip-note span {
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.12em;
}

.tip-note p {
  margin: 14px 0 0;
  font-family: "KaiTi", "DFKai-SB", serif;
  font-size: 15px;
  line-height: 1.65;
}

.plan-table {
  border-top: 2px solid var(--ink);
}

.plan-head,
.plan-row {
  display: grid;
  grid-template-columns: 65px 140px 1fr 1.5fr 48px;
  gap: 20px;
  align-items: center;
}

.plan-head {
  padding: 12px 0;
  border-bottom: 1px solid var(--ink);
  color: #738287;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.plan-row {
  min-height: 76px;
  border-bottom: 1px solid var(--line);
  transition: 150ms ease;
}

.plan-row:hover {
  padding: 0 12px;
  background: rgba(255, 253, 248, 0.72);
}

.week-number {
  color: var(--apricot);
  font-family: Georgia, serif;
  font-size: 22px;
}

.plan-row strong {
  font-family: Georgia, "Songti TC", serif;
  font-size: 16px;
  font-weight: 500;
}

.plan-row > span:nth-child(3) {
  font-size: 12px;
  font-weight: 700;
}

.plan-row p {
  color: #65767b;
  font-size: 11px;
}

.plan-row button {
  width: 34px;
  height: 34px;
  border: 1px solid var(--ink);
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

.plan-row button:hover {
  background: var(--ink);
  color: #fff;
}

.wrong-summary {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  align-items: center;
  gap: 40px;
  padding: 30px 34px;
  background: var(--ink);
  color: #fff;
}

.wrong-summary div {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.wrong-summary strong {
  font-family: Georgia, serif;
  font-size: 35px;
}

.wrong-summary span {
  color: #bdc7c9;
  font-size: 10px;
}

.wrong-list {
  border-bottom: 1px solid var(--ink);
}

.wrong-list button {
  width: 100%;
  display: grid;
  grid-template-columns: 55px 1fr auto;
  gap: 23px;
  align-items: center;
  min-height: 84px;
  padding: 14px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.wrong-list button:hover {
  background: rgba(255,255,255,0.45);
}

.wrong-list button > span {
  color: var(--apricot);
  font-family: Georgia, serif;
  font-size: 18px;
}

.wrong-list small,
.wrong-list strong {
  display: block;
}

.wrong-list small {
  margin-bottom: 5px;
  color: #7a898d;
  font-size: 9px;
}

.wrong-list strong {
  font-family: Georgia, "Songti TC", serif;
  font-size: 15px;
  font-weight: 500;
}

.wrong-list b {
  font-size: 10px;
}

.empty-state {
  padding: 60px;
  background: var(--paper-bright);
  text-align: center;
}

.empty-state.large {
  min-height: 390px;
  display: grid;
  place-content: center;
}

.empty-state.large > span {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: var(--mint);
  font-size: 28px;
}

.empty-state strong {
  font-family: Georgia, "Songti TC", serif;
  font-size: 26px;
}

.empty-state p {
  color: #718085;
  font-size: 12px;
}

.empty-state .primary {
  margin: 20px auto 0;
}

.mock-page {
  display: grid;
  place-items: center;
}

.mock-intro {
  max-width: 900px;
  padding: 20px 0;
  text-align: center;
}

.mock-intro h1 {
  margin-top: 20px;
}

.mock-intro > p {
  margin: 0 auto;
}

.mock-specs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 45px 0 38px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.mock-specs div {
  padding: 23px;
  border-right: 1px solid var(--line);
}

.mock-specs div:last-child {
  border: 0;
}

.mock-specs span,
.mock-specs strong {
  display: block;
}

.mock-specs span {
  color: #748388;
  font-size: 9px;
  letter-spacing: 0.1em;
}

.mock-specs strong {
  margin-top: 5px;
  font-family: Georgia, serif;
  font-size: 34px;
}

.large-button {
  margin: 0 auto;
  min-width: 210px;
}

.mock-note {
  display: block;
  margin-top: 20px;
  color: #77868a;
  font-size: 10px;
}

.mock-run {
  width: min(100%, 1000px);
}

.mock-toolbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin-bottom: 14px;
}

.mock-toolbar span,
.mock-toolbar strong {
  display: block;
}

.mock-toolbar span {
  color: #7a888c;
  font-size: 9px;
  text-transform: uppercase;
}

.mock-toolbar strong {
  margin-top: 3px;
  font-size: 12px;
}

.mock-toolbar > button {
  justify-self: end;
  padding: 8px 0;
  border: 0;
  border-bottom: 1px solid var(--ink);
  background: transparent;
  font-size: 10px;
  font-weight: 800;
  cursor: pointer;
}

.timer {
  font-family: "Courier New", monospace;
  font-size: 20px;
  font-weight: 700;
}

.timer.urgent {
  color: var(--red);
}

.mock-card {
  margin-top: 22px;
}

.mock-result {
  max-width: 700px;
  text-align: center;
}

.mock-result > strong {
  display: block;
  margin: 18px 0 6px;
  font-family: Georgia, serif;
  font-size: 108px;
  font-weight: 500;
  line-height: 1;
}

.mock-result > strong small {
  font-size: 24px;
}

.mock-result h2 {
  font-family: Georgia, "Songti TC", serif;
  font-size: 29px;
  font-weight: 500;
}

.mock-result p {
  color: #68787d;
  font-size: 13px;
  line-height: 1.8;
}

.mock-result .result-actions {
  justify-content: center;
}

footer {
  width: min(1280px, calc(100% - 48px));
  display: flex;
  justify-content: space-between;
  margin: 0 auto;
  padding: 27px 0 35px;
  border-top: 1px solid var(--line);
  color: #7a888c;
  font-size: 9px;
}

.mobile-nav {
  display: none;
}

@media (max-width: 980px) {
  .topbar {
    grid-template-columns: 1fr auto;
  }

  .main-nav {
    display: none;
  }

  .hero-grid {
    grid-template-columns: 1fr 0.8fr;
    gap: 35px;
  }

  .dashboard-band {
    grid-template-columns: 1fr;
  }

  .progress-block {
    padding-right: 0;
  }

  .mission-block {
    padding-left: 0;
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  .bank-strip {
    grid-template-columns: repeat(4, 1fr);
  }

  .bank-strip button {
    grid-column: 1 / -1;
    min-height: 60px;
  }

  .question-layout {
    grid-template-columns: 1fr;
  }

  .practice-aside {
    grid-template-columns: repeat(3, 1fr);
  }

  .tip-note {
    margin: 0;
  }

  .plan-head,
  .plan-row {
    grid-template-columns: 50px 120px 1fr 1.2fr 40px;
    gap: 12px;
  }
}

@media (max-width: 720px) {
  .site-shell {
    padding-bottom: 74px;
  }

  .topbar {
    width: calc(100% - 32px);
    height: 72px;
  }

  .brand small,
  .local-badge {
    display: none;
  }

  .page {
    width: calc(100% - 32px);
    padding: 46px 0 60px;
  }

  .hero-grid {
    display: flex;
    min-height: 0;
    flex-direction: column;
  }

  .hero-copy h1,
  .page-heading h1,
  .mock-intro h1 {
    font-size: 43px;
  }

  .hero-lede {
    font-size: 14px;
  }

  .hero-actions {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .accounting-note {
    width: calc(100% - 10px);
    padding: 29px 24px;
  }

  .progress-block,
  .mission-block {
    padding: 30px 0;
  }

  .progress-layout {
    gap: 23px;
  }

  .score-ring {
    width: 116px;
    height: 116px;
  }

  .bank-strip {
    grid-template-columns: 1fr 1fr;
  }

  .bank-strip > div {
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }

  .page-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 18px;
  }

  .filter-bar {
    grid-template-columns: 1fr 1fr;
  }

  .filter-bar label:nth-child(2) {
    border-right: 0;
  }

  .filter-count {
    min-height: 56px;
  }

  .question-card {
    padding: 28px 20px;
  }

  .question-meta {
    flex-wrap: wrap;
  }

  .question-meta b {
    width: 100%;
    margin: 5px 0 0;
    padding-left: 0;
  }

  .option-list {
    grid-template-columns: 1fr;
  }

  .feedback-grid {
    grid-template-columns: 1fr;
  }

  .practice-aside {
    grid-template-columns: 1fr 1fr;
  }

  .tip-note {
    grid-column: 1 / -1;
  }

  .plan-head {
    display: none;
  }

  .plan-row {
    position: relative;
    grid-template-columns: 45px 1fr 40px;
    gap: 8px 12px;
    padding: 17px 0;
  }

  .plan-row strong,
  .plan-row > span:nth-child(3),
  .plan-row p {
    grid-column: 2;
  }

  .plan-row > span:nth-child(3) {
    grid-row: 2;
  }

  .plan-row p {
    grid-row: 3;
    margin: 0;
  }

  .plan-row button {
    grid-column: 3;
    grid-row: 1 / 4;
  }

  .wrong-summary {
    grid-template-columns: 1fr 1fr;
  }

  .wrong-summary .primary {
    grid-column: 1 / -1;
  }

  .wrong-list button {
    grid-template-columns: 38px 1fr;
  }

  .wrong-list button > b {
    display: none;
  }

  .mock-specs {
    grid-template-columns: 1fr;
  }

  .mock-specs div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .mock-toolbar {
    grid-template-columns: 1fr auto;
  }

  .mock-toolbar .timer {
    grid-column: 2;
    grid-row: 1;
  }

  .mock-toolbar > button {
    grid-column: 1 / -1;
    margin-top: 10px;
    justify-self: start;
  }

  footer {
    width: calc(100% - 32px);
    flex-direction: column;
    gap: 8px;
  }

  .mobile-nav {
    position: fixed;
    z-index: 20;
    right: 0;
    bottom: 0;
    left: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 8px 8px max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid #c9c3b8;
    background: rgba(255, 253, 248, 0.96);
    backdrop-filter: blur(16px);
  }

  .mobile-nav button {
    display: grid;
    gap: 3px;
    justify-items: center;
    padding: 3px;
    border: 0;
    background: transparent;
    color: #7b888c;
    font-size: 8px;
    font-weight: 800;
  }

  .mobile-nav button span {
    font-size: 17px;
  }

  .mobile-nav button.active {
    color: var(--ink);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
